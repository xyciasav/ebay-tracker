<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline - eBay Tracker</title>
  <style>
    :root{ color-scheme:dark; }
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:#0b0f19;
      color:#e5e7eb;
    }
    main{
      width:min(460px, calc(100vw - 32px));
      border:1px solid #243049;
      border-radius:18px;
      background:#0f172a;
      padding:22px;
      box-shadow:0 18px 60px rgba(0,0,0,.24);
    }
    .mark{
      width:48px;
      height:48px;
      border-radius:16px;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,#60a5fa,#22c55e);
      color:#fff;
      font-weight:900;
      margin-bottom:14px;
    }
    h1{ margin:0 0 8px; font-size:24px; }
    p{ margin:0; color:#9ca3af; line-height:1.45; }
  </style>
</head>
<body>
  <main>
    <div class="mark">ET</div>
    <h1>You're offline</h1>
    <p>eBay Tracker is installed, but the inventory database needs the server connection. Reconnect and refresh to keep working.</p>
  </main>
</body>
</html>
