<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}eBay Tracker{% endblock %}</title>
  <meta name="theme-color" content="#0f172a"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="eBay Tracker"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <link rel="manifest" href="{{ url_for('web_manifest') }}"/>
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/pwa-192.png') }}"/>
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/pwa-192.png') }}"/>

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#111111;
      --muted:#666666;
      --border:#e6e8ef;
      --border2:#eef0f6;
      --btn:#111111;
      --btnText:#ffffff;
      --btnSecondaryBg:#ffffff;
      --btnSecondaryText:#111111;
      --pillBg:#fafafa;
      --thumbBg:#fafafa;
      --inputBg:#ffffff;
      --link:#2563eb;
      --linkVisited:#7c3aed;
      --accent:#2563eb;
      --success:#16a34a;
      --warning:#f59e0b;
      --danger:#dc2626;
      --soft:#f8fafc;
    }

    [data-theme="dark"]{
      --bg:#0b0f19;
      --card:#0f172a;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --border:#243049;
      --border2:#1f2a44;
      --btn:#e5e7eb;
      --btnText:#0b0f19;
      --btnSecondaryBg:#0f172a;
      --btnSecondaryText:#e5e7eb;
      --pillBg:#111827;
      --thumbBg:#111827;
      --inputBg:#0b1224;
      --link:#60a5fa;
      --linkVisited:#c084fc;
      --accent:#60a5fa;
      --success:#22c55e;
      --warning:#fbbf24;
      --danger:#f87171;
      --soft:#111827;
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap: 12px;
      flex-wrap: wrap;
    }

    header a { color: var(--text); text-decoration:none; }
    a { color: var(--link); }
    a:visited { color: var(--linkVisited); }

    .brand-link{
      display:inline-flex;
      align-items:center;
      gap:10px;
      color:var(--text);
      text-decoration:none;
      font-weight:800;
      letter-spacing:-.02em;
    }
    .brand-mark{
      width:30px;
      height:30px;
      border-radius:10px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--success) 55%, var(--accent)));
      color:#fff;
      font-size:13px;
      box-shadow:0 8px 22px rgba(37, 99, 235, .18);
      flex:0 0 auto;
    }

    .wrap { max-width:1200px; margin:0 auto; padding:16px; }

    .card {
      background: var(--card);
      border:1px solid var(--border);
      border-radius:12px;
      padding:14px;
    }

    .grid {
      display:grid;
      gap:12px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }

    .kpi {
      font-size: 26px;
      font-weight: 700;
      margin-top: 6px;
    }

    label { font-size:12px; color:var(--muted); }

    input, select, textarea {
      width:100%;
      padding:10px;
      border-radius:10px;
      border:1px solid var(--border);
      background:var(--inputBg);
      color:var(--text);
      box-sizing: border-box;
    }

    textarea { min-height: 90px; }

    .btn {
      background:var(--btn);
      color:var(--btnText);
      padding:10px 12px;
      border-radius:10px;
      border:1px solid var(--btn);
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }

    .btn.secondary {
      background:var(--btnSecondaryBg);
      color:var(--btnSecondaryText);
      border-color:var(--border);
    }

    .iconbtn {
      border:1px solid var(--border);
      background:var(--btnSecondaryBg);
      color:var(--btnSecondaryText);
      padding:10px 12px;
      border-radius:10px;
      cursor:pointer;
    }

    .small { font-size:12px; color: var(--muted); }
    .flash { margin: 10px 0; padding: 10px 12px; border-radius: 10px; border:1px solid var(--border); background: var(--card); }
    .flash.success { border-color: #16a34a55; }
    .flash.error { border-color: #dc262655; }
    .flash.warning { border-color: #f59e0b55; }

    table{
      width:100%;
      border-collapse: collapse;
      overflow:hidden;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
    }
    th, td{
      padding: 10px 10px;
      border-bottom: 1px solid var(--border2);
      text-align:left;
      vertical-align: top;
      font-size: 14px;
    }
    th{ font-size: 12px; color: var(--muted); font-weight: 600; }

    .pill{
      display:inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--pillBg);
      font-size: 12px;
      white-space:nowrap;
    }

    .pill.sold { border-color: color-mix(in srgb, var(--success) 45%, var(--border)); color: var(--success); }
    .pill.listed { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); color: var(--accent); }
    .pill.not-listed { border-color: color-mix(in srgb, var(--warning) 55%, var(--border)); color: var(--warning); }
    .pill.review { border-color: color-mix(in srgb, var(--warning) 70%, var(--border)); color: var(--warning); font-weight:700; }
    .pill.pending { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); color: var(--accent); font-weight:700; }
    .pill.canceled { border-color: color-mix(in srgb, var(--danger) 60%, var(--border)); color: var(--danger); font-weight:700; }

    .page-hero{
      display:flex;
      justify-content:space-between;
      gap:16px;
      align-items:flex-start;
      margin-bottom:14px;
    }
    .page-hero h1{
      margin:0 0 6px 0;
      font-size: clamp(28px, 5vw, 42px);
      line-height:1;
      letter-spacing:-0.04em;
    }
    .toolbar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .status-tabs{
      display:grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap:8px;
      margin-bottom:14px;
    }
    .status-tab{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:14px;
      padding:10px 9px;
      color:var(--text);
      text-decoration:none;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      min-width:0;
    }
    .status-tab span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; font-size:13px; }
    .status-tab:visited{ color:var(--text); }
    .status-tab b{ font-size:20px; }
    .status-tab.active{
      border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
      box-shadow: 0 10px 30px rgba(37, 99, 235, .10);
    }
    .filter-card{ margin-bottom:14px; }
    .filter-grid{
      display:grid;
      grid-template-columns: minmax(180px, 1fr) minmax(110px, 135px) minmax(125px, 155px) minmax(140px, 180px) minmax(210px, 255px) auto;
      gap:10px;
      align-items:end;
    }
    .filter-actions{
      display:flex;
      gap:10px;
      align-items:center;
      white-space:nowrap;
    }
    .bulk-panel summary{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      cursor:pointer;
      list-style:none;
      font-weight:700;
    }
    .bulk-panel summary::-webkit-details-marker{ display:none; }
    .bulk-panel summary::before{
      content:"+";
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:22px;
      height:22px;
      border-radius:999px;
      border:1px solid var(--border);
      margin-right:2px;
      font-weight:800;
    }
    .bulk-panel[open] summary::before{ content:"-"; }
    .view-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin:8px 0 12px;
    }
    .segmented{
      display:inline-flex;
      border:1px solid var(--border);
      background:var(--card);
      border-radius:999px;
      padding:3px;
    }
    .segmented a{
      color:var(--text);
      text-decoration:none;
      padding:7px 12px;
      border-radius:999px;
      font-size:13px;
    }
    .segmented a.active{
      background:var(--btn);
      color:var(--btnText);
    }
    .inventory-grid{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap:14px;
    }
    .item-card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      overflow:hidden;
      contain:layout paint;
      display:flex;
      flex-direction:column;
      min-height:100%;
      min-width:0;
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }
    .item-card:hover{
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--accent) 35%, var(--border));
      box-shadow: 0 14px 35px rgba(15, 23, 42, .10);
    }
    .item-photo{
      height:190px;
      flex:0 0 190px;
      width:100%;
      max-width:100%;
      min-width:0;
      aspect-ratio:4 / 3;
      position:relative;
      background:var(--soft);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--muted);
      text-decoration:none;
      border-bottom:1px solid var(--border2);
      overflow:hidden;
    }
    .item-photo img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      max-width:100%;
      max-height:100%;
      object-fit:contain;
      display:block;
    }
    .item-card-body{
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
      flex:1;
      min-width:0;
      overflow:hidden;
    }
    .item-card-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .item-card h3{
      margin:0;
      font-size:16px;
      line-height:1.25;
      overflow-wrap:anywhere;
    }
    .item-card h3 a{
      color:var(--text);
      text-decoration:none;
    }
    .meta-row{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      max-width:100%;
      overflow:hidden;
    }
    .meta-row span{
      border:1px solid var(--border);
      border-radius:999px;
      padding:4px 8px;
      font-size:12px;
      color:var(--muted);
      background:var(--pillBg);
      flex:1 1 auto;
      min-width:0;
      max-width:100%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .checklist{
      display:grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap:6px;
      max-width:100%;
      overflow:hidden;
    }
    .checklist span{
      border:1px dashed var(--border);
      border-radius:8px;
      padding:6px 4px;
      text-align:center;
      color:var(--muted);
      font-size:12px;
      white-space:nowrap;
    }
    .checklist span.done{
      border-style:solid;
      border-color: color-mix(in srgb, var(--success) 45%, var(--border));
      color:var(--success);
      background: color-mix(in srgb, var(--success) 8%, transparent);
    }
    .ebay-line{
      padding-top:2px;
      min-height:16px;
    }
    .card-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:auto;
    }
    .item-page-actions{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      margin-bottom:12px;
    }
    .item-page-actions form{ margin:0; }
    .item-hero{
      display:grid;
      grid-template-columns: minmax(260px, 380px) 1fr;
      gap:16px;
      align-items:start;
    }
    .item-hero-photo{
      aspect-ratio: 4 / 3;
      min-height:0;
      height:auto;
      max-height:420px;
      border:1px solid var(--border2);
      background:var(--soft);
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      color:var(--muted);
    }
    .item-hero-photo a{
      display:block;
      width:100%;
      height:100%;
      min-width:0;
      overflow:hidden;
    }
    .item-hero-photo img{
      width:100%;
      height:100%;
      max-height:420px;
      object-fit:contain;
      display:block;
    }
    .item-hero-info h1{
      font-size: clamp(24px, 4vw, 34px);
      line-height:1.05;
      letter-spacing:-0.03em;
    }
    .item-money-grid,
    .detail-grid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap:10px;
      margin-top:14px;
    }
    .item-money-grid > div,
    .detail-grid > div{
      border:1px solid var(--border2);
      border-radius:12px;
      padding:10px;
      background:var(--soft);
    }
    .item-money-grid strong{
      display:block;
      font-size:20px;
      margin-top:4px;
    }
    .table-card{ overflow:auto; }
    .empty-state{
      grid-column: 1 / -1;
      text-align:center;
      padding:28px;
    }

    /* Photo thumbnails (if you're using them) */
    .photo-grid{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:8px;
    }
    .thumb{
      width: 180px;
      height: 180px;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--thumbBg);
      display:block;
    }
    @media (max-width: 520px){
      .thumb{ width: 120px; height: 120px; }
      .status-tabs{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filter-grid{ grid-template-columns: 1fr; }
      .page-hero{ display:block; }
      .toolbar{ justify-content:flex-start; margin-top:12px; }
      .inventory-grid{ grid-template-columns: 1fr; }
      .item-photo{ height:220px; flex-basis:220px; }
      .item-hero{ grid-template-columns: 1fr; }
      .item-hero-photo{ max-height:320px; }
    }
    @media (max-width: 880px){
      .status-tabs{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filter-grid{ grid-template-columns: 1fr 1fr; }
      .filter-actions{ grid-column: 1 / -1; }
      .page-hero{ flex-direction:column; }
    }
    @media (min-width: 881px) and (max-width: 1120px){
      .status-tabs{ grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .filter-grid{ grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
</head>

<body>
  <header>
    <div>
      <a class="brand-link" href="{{ url_for('index') }}"><span class="brand-mark">ET</span><span>eBay Tracker</span></a>
      <span class="small">&mdash; lightweight inventory + profit</span>
    </div>

    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
      <a class="btn secondary" href="{{ url_for('index') }}">Inventory</a>
      <a class="btn secondary" href="{{ url_for('reports') }}">Reports</a>
      <a class="btn secondary" href="{{ url_for('categories_manage') }}">Categories</a>
      <a class="btn secondary" href="{{ url_for('store_settings') }}">Store</a>
      
      <button class="iconbtn" type="button" id="themeBtn" title="Toggle dark mode">Dark</button>
    </div>
  </header>

  <div class="wrap">
    {% with messages = get_flashed_messages(with_categories=True) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="flash {{ category }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>

  <script>
    (function(){
      const root = document.documentElement;
      const saved = localStorage.getItem("theme");
      if (saved) root.setAttribute("data-theme", saved);

      const btn = document.getElementById("themeBtn");
      if (!btn) return;

      btn.addEventListener("click", () => {
        const current = root.getAttribute("data-theme") || "light";
        const next = current === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
      });
    })();
  </script>
  <script src="{{ url_for('static', filename='tools.js') }}"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("{{ url_for('service_worker') }}").catch(() => {});
      });
    }
  </script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <script>
  function $(id){ return document.getElementById(id); }

  let codeReader = null;
  let scanning = false;

  function setStatus(msg, isError=false){
    const el = $("barcodeStatus");
    if (!el) return;
    el.textContent = msg;
    el.style.color = isError ? "var(--danger, #c0392b)" : "var(--muted, #666)";
  }

  async function startBarcodeScan(){
    if (scanning) return;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus("Camera APIs not available in this browser.", true);
      return;
    }

    $("barcodeScannerWrap").style.display = "block";
    setStatus("Starting camera...");

    try {
      scanning = true;
      codeReader = new ZXing.BrowserMultiFormatReader();

      // Prefer rear camera
      const devices = await ZXing.BrowserCodeReader.listVideoInputDevices();
      const rear = devices.find(d => /back|rear|environment/i.test(d.label));
      const deviceId = (rear && rear.deviceId) ? rear.deviceId : (devices[0]?.deviceId || null);

      if (!deviceId) {
        setStatus("No camera found.", true);
        stopBarcodeScan();
        return;
      }

      setStatus("Point at barcode...");

      // decodeFromVideoDevice renders into your <video>
      codeReader.decodeFromVideoDevice(deviceId, "barcodeVideo", (result, err) => {
        if (result) {
          const text = result.getText();
          $("barcode").value = text;

          // If compsQuery is empty, auto-fill it too
          const cq = $("compsQuery");
          if (cq && !cq.value.trim()) cq.value = text;

          setStatus("Scanned OK " + text);
          stopBarcodeScan(); // auto-close after success
        }
      });

    } catch (e) {
      console.error(e);
      setStatus("Camera failed to start. Check HTTPS + permissions.", true);
      stopBarcodeScan();
    }
  }

  function stopBarcodeScan(){
    scanning = false;

    try {
      if (codeReader) {
        codeReader.reset();
        codeReader = null;
      }
    } catch (e) {}

    $("barcodeScannerWrap").style.display = "none";
  }

  document.addEventListener("DOMContentLoaded", () => {
    const btn = $("btnScanBarcode");
    const close = $("btnCloseBarcode");

    if (btn) btn.addEventListener("click", startBarcodeScan);
    if (close) close.addEventListener("click", stopBarcodeScan);

    // If you navigate away or submit, stop camera
    window.addEventListener("beforeunload", stopBarcodeScan);
  });
</script>
</body>
</html>
